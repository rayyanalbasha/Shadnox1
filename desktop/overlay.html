<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Screen Overlay</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
    }
    #shade {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="shade"></div>
  <script>
    const shade = document.getElementById("shade");
    const solid = navigator.userAgent.includes("Windows");
    if (solid) {
      // Windows: the window itself is black and its opacity is set by the app.
      document.documentElement.style.background = "#000";
      document.body.style.background = "#000";
      shade.style.backgroundColor = "#000";
    } else {
      window.privateScreen.onOverlayUpdate(state => {
        const opacity = Math.max(0, Math.min(90, Number(state.strength) || 0)) / 100;
        shade.style.backgroundColor = `rgba(0, 0, 0, ${opacity})`;
      });
    }
  </script>
</body>
</html>

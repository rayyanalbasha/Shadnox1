name: Build installers and mobile app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "mobile/**"
      - "website/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build desktop installer
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 7

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        working-directory: mobile/android
        run: gradle assembleDebug
      - name: Name APK for website download
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Shadnox-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shadnox-Android.apk
          path: Shadnox-Android.apk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [desktop-build, android-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Shadnox build ${{ github.run_number }}" \
            --notes "Automated desktop installers and Android APK. The Android APK is a debug-signed build for testing. iPhone users can install the website as a Home Screen web app using Safari." \
            --latest

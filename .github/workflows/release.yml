name: Build installers and mobile app
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "mobile/**"
      - "website/**"
      - ".github/workflows/release.yml"
permissions:
  contents: write
jobs:
  desktop-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build desktop installer
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: desktop/release/*
          if-no-files-found: error
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        working-directory: mobile/android
        run: gradle assembleDebug
      - name: Prepare Android APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk PrivateScreen-Android.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: PrivateScreen-Android.apk
          if-no-files-found: error
  release:
    needs:
      - desktop-build
      - android-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check release files
        run: |
          find dist -maxdepth 2 -type f -print
          test -n "$(find dist -maxdepth 2 -type f -print -quit)"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "PrivateScreen build ${{ github.run_number }}" \
              --notes "Automated desktop installers and Android testing APK."
          fi
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --latest

name: Build installers and publish release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "android/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: windows
            pattern: Shadnox-Windows-Setup.exe
            optional: false
          - os: macos-latest
            script: build:mac
            artifact: macos
            pattern: Shadnox-macOS-Universal.dmg
            optional: false
          - os: ubuntu-latest
            script: build:linux
            artifact: linux
            pattern: Shadnox-Linux.*
            optional: true
    runs-on: ${{ matrix.os }}
    # A problem in the optional Linux build never blocks the Windows and macOS release.
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/release/${{ matrix.pattern }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    # If this job fails it shows RED in Actions (so you notice), but the desktop
    # release below still gets published because the release job uses always().
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Make sure the Android SDK pieces exist
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          exit 0
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Name the APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK" || { echo "::error::No APK was produced"; exit 1; }
          cp "$APK" Shadnox-Android.apk
          ls -la Shadnox-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Shadnox-Android.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    if: ${{ always() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -la dist
      - name: Check the required files exist
        run: |
          for f in Shadnox-Windows-Setup.exe Shadnox-macOS-Universal.dmg; do
            test -f "dist/$f" || { echo "::error::Missing dist/$f - website download would 404"; exit 1; }
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Shadnox build ${{ github.run_number }}" \
            --notes "Automated build: Windows, macOS, Linux and Android" \
            --latest
      - name: Warn loudly if the Android APK is missing
        run: |
          test -f dist/Shadnox-Android.apk || { echo "::error::Shadnox-Android.apk is missing from the release - the Android download will 404. Open the 'android' job above to see why it failed."; exit 1; }

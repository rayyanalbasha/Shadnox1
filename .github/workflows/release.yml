name: Build installers and publish release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "android/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: windows
            pattern: PrivateScreen-Windows-Setup.exe
            optional: false
          - os: macos-latest
            script: build:mac
            artifact: macos
            pattern: PrivateScreen-macOS-Universal.dmg
            optional: false
          - os: ubuntu-latest
            script: build:linux
            artifact: linux
            pattern: PrivateScreen-Linux.*
            optional: true
    runs-on: ${{ matrix.os }}
    # A problem in the optional Linux build never blocks the Windows and macOS release.
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/release/${{ matrix.pattern }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    # A problem in the Android build never blocks the desktop release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Shadnox-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Shadnox-Android.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    if: ${{ always() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -la dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Shadnox build ${{ github.run_number }}" \
            --notes "Automated build: Windows, macOS, Linux and Android" \
            --latest
